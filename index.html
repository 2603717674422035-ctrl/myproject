<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile Card</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, lightblue, lavender);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .profile-card {
            width: 320px;
            background: white;

            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 10px 25px gray;

            text-align: center;

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px gray;
        }

        .card-header {
            padding: 25px 20px 20px;

            background: linear-gradient(135deg, skyblue, mediumpurple);
        }

        .profile-img {
            width: 120px;
            height: 120px;

            border-radius: 50%;
            object-fit: cover;

            border: 5px solid white;
        }

        .card-content {
            padding: 20px 25px 25px;
        }

        .card-content h2 {
            margin: 10px 0 5px;

            font-size: 25px;
            color: black;
        }

        
        .department {
            color: purple;

            font-weight: bold;

            margin-bottom: 15px;
        }

    
        .email {
            color: gray;

            font-size: 14px;

            margin: 15px 0;
        }

        
        .description {
            color: dimgray;

            line-height: 1.6;

            font-size: 14px;
        }

        .profile-btn {
            padding: 10px 25px;

            border: none;

            border-radius: 20px;

            background: linear-gradient(135deg, skyblue, mediumpurple);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: transform 0.3s ease;
        }

        .profile-btn:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <div class="card-header">

            <img src="student.jpg"
                 alt="Student Photo"
                 class="profile-img">

        </div>

        <div class="card-content">

            <h2>Priya M</h2>

            <div class="department">
                Computer Science 
            </div>

            <p class="email">
                📧 priya@gmail.com
            </p>

            <p class="description">
               A passionate student interested in technology,programming and learning new skills</p>

            <button class="profile-btn">
                View Profile
            </button>

        </div>

    </div>

</body>

</html>
